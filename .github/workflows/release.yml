name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/rust.yml
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.14.0
          run_install: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: ${{ runner.temp }}/artifacts
          merge-multiple: true
      - name: Check tag and package versions
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: node scripts/release.cjs validate "$RUNNER_TEMP/artifacts"
      - name: Publish native packages, then launcher (OIDC)
        run: node scripts/release.cjs publish "$RUNNER_TEMP/artifacts"
      - name: Publish checksummed native downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.cjs github "$RUNNER_TEMP/artifacts"
