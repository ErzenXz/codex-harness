[package]
name = "piko"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "A tiny, powerful native coding agent"
license = "MIT"
repository = "https://github.com/ErzenXz/piko"

[dependencies]
anyhow = "1"
base64 = "0.22"
futures-util = "0.3"
globset = "0.4"
ignore = "0.4"
libc = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "io-std", "io-util", "fs", "process", "sync", "time", "signal", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[lints.clippy]
await_holding_lock = "deny"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
